<script>
const API='';
const demoRuns=[
 {run_id:'demo-ndpa',status:'awaiting_review',metadata:{framework_name:'Nigeria Data Protection Act',short_name:'NDP Act',country:'Nigeria',regulator:'Nigeria Data Protection Commission',version:'2023'},source:{verified:true,sha256:'demonstration'},requirements:Array.from({length:9},(_,i)=>({requirement_id:`REQ-${String(i+1).padStart(4,'0')}`,source_reference:`Provision ${i+1}`,source_text:'Illustrative requirement shown until a live BPO source pack is submitted.',kind:'mandatory'})),mappings:[],qa_findings:[],agent_trace:[],updated_at:new Date().toISOString()},
 {run_id:'demo-cbn',status:'processing',metadata:{framework_name:'CBN Risk-Based Cybersecurity Framework',short_name:'CBN RCSF',country:'Nigeria',regulator:'Central Bank of Nigeria',version:'2024'},source:{verified:true},requirements:Array(7).fill({}),qa_findings:[],updated_at:new Date().toISOString()},
 {run_id:'demo-rework',status:'needs_rework',metadata:{framework_name:'Regional Privacy Regulation',short_name:'RPR',country:'Research Queue',regulator:'BPO Research',version:'Draft'},source:{verified:false},requirements:Array(4).fill({}),qa_findings:[{severity:'blocker',code:'SOURCE_NOT_VERIFIED',message:'Official source and content rights must be verified.'}],updated_at:new Date().toISOString()}
];
let runs=[...demoRuns], selected=null, currentView='command', detail=null;
const stageNames=['Verify source','Decompose','Classify','Map controls','Generate','Challenge'];
const controlSeed=[['AEGIS-GOV-001','Governance','Governance & accountability'],['AEGIS-IAM-001','Identity & Access','Access management'],['AEGIS-IR-001','Incident Management','Incident response & notification'],['AEGIS-RISK-001','Risk Management','Risk assessment & treatment'],['AEGIS-PEOPLE-001','People','Training & awareness'],['AEGIS-TPRM-001','Third Party','Third-party due diligence'],['AEGIS-PRIV-001','Privacy','Privacy management']];
const names={command:'Command center',ingest:'Framework ingestion',review:'GRC review queue',controls:'Universal controls',published:'Published registry'};
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function status(v){const map={processing:['Agent build','blue'],awaiting_review:['GRC review','amber'],needs_rework:['Needs rework','red'],approved:['Approved','green'],rejected:['Rejected','slate'],published:['Published','green']};const [l,t]=map[v]||[v,'slate'];return `<span class="status ${t}">${esc(l)}</span>`}
function fw(r){return esc((r.metadata?.short_name||'FW').slice(0,2))}
function setView(v){currentView=v;document.querySelectorAll('#nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('pageName').textContent=names[v];document.getElementById('sidebar').classList.remove('open');render()}

async function loadRuns(){try{const r=await fetch(`${API}/v1/runs`);if(r.ok){const data=await r.json();if(data.length)runs=data}}catch(e){}updateCounts();render()}
function updateCounts(){document.getElementById('reviewCount').textContent=runs.filter(r=>['awaiting_review','needs_rework','approved'].includes(r.status)).length}
function page(inner){return `<div class="page">${inner}</div>`}
function render(){if(currentView==='command')renderCommand();if(currentView==='ingest')renderIngest();if(currentView==='review')renderReview();if(currentView==='controls')renderControls();if(currentView==='published')renderPublished()}
function renderCommand(){const review=runs.filter(r=>r.status==='awaiting_review').length,rework=runs.filter(r=>r.status==='needs_rework').length,pub=runs.filter(r=>r.status==='published').length,active=runs.filter(r=>r.status==='processing').length;document.getElementById('app').innerHTML=page(`<section class="hero"><div><div class="eyebrow">Compliance intelligence operations</div><h1>Frameworks become governed data,<br><span>not another hard-coded app.</span></h1><p>Track each framework from BPO source pack through agentic build, source-traceable requirements, Universal Control mapping, independent QA, qualified human review and controlled Aegis publication.</p><button class="primary" data-go="ingest">Start framework build →</button></div><div class="hero-score"><small>PIPELINE INTEGRITY</small><strong>6/6</strong><span>agent stages traceable</span><div>✓ human gate required</div></div></section><section class="metrics"><div class="metric"><div class="micon">↻</div><span>Active builds</span><strong>${active}</strong><small>agent pipeline</small></div><div class="metric"><div class="micon">✓</div><span>Awaiting GRC</span><strong>${review}</strong><small>human decisions</small></div><div class="metric"><div class="micon">!</div><span>Needs rework</span><strong>${rework}</strong><small>blocked by QA</small></div><div class="metric"><div class="micon">▣</div><span>Published</span><strong>${pub}</strong><small>governed versions</small></div></section><div class="two"><section class="panel"><div class="panel-head"><div><small>AGENTIC PIPELINE</small><h3>What happens after BPO submission</h3></div></div><div class="pipeline">${stageNames.map((s,i)=>`<div class="stage"><b>0${i+1}</b><span><strong>${s}</strong><small>${i===0?'Provenance, identity & rights':i===1?'Clauses into atomic obligations':i===2?'Type, deadlines & applicability':i===3?'Universal control relationships':i===4?'Questions & evidence requests':'Independent QA before review'}</small></span></div>`).join('')}</div></section><section class="panel attention"><div class="panel-head"><div><small>DECISION QUEUE</small><h3>Needs human attention</h3></div></div>${runs.filter(r=>['awaiting_review','needs_rework'].includes(r.status)).slice(0,4).map(r=>`<button class="row" data-review="${esc(r.run_id)}"><div class="fwmark">${fw(r)}</div><span class="copy"><strong>${esc(r.metadata?.framework_name)}</strong><small>${esc(r.metadata?.regulator)}</small></span>${status(r.status)}</button>`).join('')}</section></div><section class="panel registry"><div class="panel-head"><div><small>BUILD REGISTRY</small><h3>Recent framework runs</h3></div></div><div class="table-wrap"><table><thead><tr><th>Framework</th><th>Authority</th><th>Requirements</th><th>Status</th><th>Updated</th></tr></thead><tbody>${runs.map(r=>`<tr data-review="${esc(r.run_id)}"><td><strong>${esc(r.metadata?.framework_name)}</strong><small>${esc(r.metadata?.country||'')} · v${esc(r.metadata?.version||'')}</small></td><td>${esc(r.metadata?.regulator||'')}</td><td>${r.requirements?.length||0}</td><td>${status(r.status)}</td><td>${new Date(r.updated_at||Date.now()).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div></section>`);document.querySelector('[data-go="ingest"]').onclick=()=>setView('ingest');bindReviewLinks()}
function bindReviewLinks(){document.querySelectorAll('[data-review]').forEach(x=>x.onclick=()=>{selected=runs.find(r=>r.run_id===x.dataset.review);detail=null;setView('review')})}
function renderIngest(){document.getElementById('app').innerHTML=page(`<section class="page-title"><div class="eyebrow">BPO source handoff</div><h2>Submit the regulatory source pack.</h2><p>The original source identity stays attached to every derived requirement. Unverified provenance and blocking QA findings prevent approval.</p></section><div class="ingest-grid"><section class="panel form"><div class="step"><b>01</b><div><h3>Framework identity</h3><p>Describe exactly what the BPO team researched.</p></div></div><div class="grid"><label>Framework name<input id="fwName" placeholder="Bank of Ghana Cybersecurity Directive"></label><label>Short name<input id="shortName" placeholder="BOG-CSD"></label><label>Country<input id="country" value="Nigeria"></label><label>Regulator / authority<input id="regulator" placeholder="Official issuing authority"></label><label>Industry<input id="industry" placeholder="Financial Services"></label><label>Version<input id="version" placeholder="2026"></label></div><hr><div class="step"><b>02</b><div><h3>Source provenance</h3><p>Publication remains blocked when source identity or rights are unresolved.</p></div></div><div class="grid"><label class="wide">Official source URI<input id="sourceUri" placeholder="https://regulator.gov/... official source"></label><label>Content rights<select id="rights"><option value="public_regulatory_document">Public regulatory document</option><option value="licensed">Licensed</option><option value="internal_use">Internal use only</option><option value="legal_review_required">Legal review required</option></select></label><label>Submitted by<input id="submittedBy" value="BPO Research Team"></label></div><hr><div class="step"><b>03</b><div><h3>Regulatory material</h3><p>Paste text or load a TXT/Markdown research export for the pilot parser.</p></div></div><textarea id="sourceText" class="source-area" placeholder="Section 1.1: The organisation shall...&#10;Section 1.2: The institution must..."></textarea><div class="file-row"><input id="sourceFile" type="file" accept=".txt,.md,text/plain,text/markdown"><span class="api-note">PDF/DOCX parsing is the next document adapter.</span></div><div class="form-foot"><span class="message" id="formMessage"></span><button class="primary" id="submitBuild">Run agentic build →</button></div></section><aside class="panel guardrail"><div class="lock">▣</div><small>NON-NEGOTIABLE GATE</small><h3>Agents can build.<br>Agents cannot publish.</h3><p>The factory records what the agents proposed and why. A qualified human remains accountable for the production decision.</p><div class="check"><b>✓</b> Source hash recorded</div><div class="check"><b>✓</b> Source references retained</div><div class="check"><b>✓</b> Mapping confidence visible</div><div class="check"><b>✓</b> Human decision audited</div></aside></div>`);document.getElementById('sourceFile').onchange=async e=>{const f=e.target.files[0];if(f)document.getElementById('sourceText').value=await f.text()};document.getElementById('submitBuild').onclick=submitBuild}
async function submitBuild(){const msg=document.getElementById('formMessage'),button=document.getElementById('submitBuild');const metadata={framework_name:document.getElementById('fwName').value,short_name:document.getElementById('shortName').value,country:document.getElementById('country').value,regulator:document.getElementById('regulator').value,industry:document.getElementById('industry').value,version:document.getElementById('version').value,source_uri:document.getElementById('sourceUri').value,content_rights:document.getElementById('rights').value,submitted_by:document.getElementById('submittedBy').value},source_text=document.getElementById('sourceText').value;if(!metadata.framework_name||!source_text){msg.textContent='Framework name and source text are required.';return}button.disabled=true;button.textContent='Building framework…';try{const r=await fetch(`${API}/v1/runs/text`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metadata,source_text,filename:`${metadata.short_name||'framework'}.md`})});if(!r.ok)throw new Error(await r.text());const run=await r.json();runs=[run,...runs.filter(x=>!x.run_id.startsWith('demo-'))];selected=run;detail=run;updateCounts();setView('review')}catch(e){msg.textContent=`Could not submit build: ${e.message}`}finally{button.disabled=false;button.textContent='Run agentic build →'}}
async function renderReview(){const queue=runs.filter(r=>['awaiting_review','needs_rework','approved'].includes(r.status));if(!selected)selected=queue[0];if(!selected){document.getElementById('app').innerHTML=page(`<div class="empty"><b>No active GRC reviews</b><p>New agent builds appear here after QA.</p></div>`);return}if(!String(selected.run_id).startsWith('demo-')){try{const r=await fetch(`${API}/v1/runs/${selected.run_id}`);if(r.ok)detail=await r.json()}catch(e){}}const d=detail||selected;const maps=Object.fromEntries((d.mappings||[]).map(m=>[m.requirement_id,m]));document.getElementById('app').innerHTML=page(`<section class="review-title"><div><div class="eyebrow">Human decision workspace</div><h2>${esc(d.metadata?.framework_name)}</h2><p>${esc(d.metadata?.regulator||'')} · ${esc(d.metadata?.country||'')} · Version ${esc(d.metadata?.version||'')}</p></div><div class="review-actions">${status(d.status)}${d.status==='approved'?'<button class="primary" id="publishBtn">Publish approved version</button>':`<button class="danger" id="rejectBtn">Reject</button><button class="primary" id="approveBtn" ${d.status==='needs_rework'?'disabled':''}>Approve framework</button>`}</div></section><div class="review-layout"><aside class="panel queue"><div class="panel-head"><div><small>QUEUE</small><h3>${queue.length} active reviews</h3></div></div>${queue.map(r=>`<button class="row ${r.run_id===selected.run_id?'active':''}" data-queue="${esc(r.run_id)}"><div class="fwmark">${fw(r)}</div><span class="copy"><strong>${esc(r.metadata?.framework_name)}</strong><small>${esc(r.metadata?.regulator||'')}</small>${status(r.status)}</span></button>`).join('')}</aside><section class="panel detail"><div class="facts"><div class="fact"><small>Source provenance</small><strong class="${d.source?.verified?'good':''}">${d.source?.verified?'Verified':'Not verified'}</strong></div><div class="fact"><small>Source fingerprint</small><strong>${esc((d.source?.sha256||'not available').slice(0,14))}…</strong></div><div class="fact"><small>Requirements</small><strong>${d.requirements?.length||0}</strong></div><div class="fact"><small>QA blockers</small><strong>${(d.qa_findings||[]).filter(f=>f.severity==='blocker').length}</strong></div></div><div class="tabs"><button class="active" data-tab="requirements">Requirements & mappings</button><button data-tab="qa">QA findings</button><button data-tab="agents">Agent trace</button><button data-tab="audit">Audit trail</button></div><div class="tab-body" id="tabBody">${requirementsHTML(d,maps)}</div><label class="note-label">Reviewer decision note<textarea id="reviewNote" placeholder="Record the basis for approval, rejection or requested rework."></textarea></label></section></div>`);document.querySelectorAll('[data-queue]').forEach(b=>b.onclick=()=>{selected=runs.find(r=>r.run_id===b.dataset.queue);detail=null;renderReview()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tabBody').innerHTML=b.dataset.tab==='requirements'?requirementsHTML(d,maps):b.dataset.tab==='qa'?qaHTML(d):b.dataset.tab==='agents'?traceHTML(d.agent_trace||[],true):traceHTML(d.audit||[],false)});if(document.getElementById('approveBtn'))document.getElementById('approveBtn').onclick=()=>reviewDecision('approve');if(document.getElementById('rejectBtn'))document.getElementById('rejectBtn').onclick=()=>reviewDecision('reject');if(document.getElementById('publishBtn'))document.getElementById('publishBtn').onclick=publishSelected}
function requirementsHTML(d,maps){return `<div>${(d.requirements||[]).map(req=>{const m=maps[req.requirement_id];return `<article class="req"><div class="req-head"><span>${esc(req.requirement_id)} · ${esc(req.source_reference)}</span><b>${esc(req.kind||'')}</b></div><blockquote>${esc(req.source_text||'')}</blockquote><div class="mapbox"><div><small>AEGIS UNIVERSAL CONTROL</small><strong>${esc(m?.control_id||'Mapping pending')}</strong></div><div><small>RELATIONSHIP</small><strong>${esc((m?.mapping_type||'—').replaceAll('_',' '))}</strong></div><div><small>CONFIDENCE</small><strong>${m?Math.round(m.confidence*100)+'%':'—'}</strong></div></div></article>`}).join('')}</div>`}
function qaHTML(d){if(!(d.qa_findings||[]).length)return `<div class="empty"><b>No blocking QA findings</b><p>This build can proceed to qualified human review.</p></div>`;return (d.qa_findings||[]).map(f=>`<div class="finding ${esc(f.severity)}"><span>●</span><div><b>${esc(f.code)}</b><p>${esc(f.message)}</p></div></div>`).join('')}
function traceHTML(rows,agent){if(!rows.length)return `<div class="empty"><b>${agent?'Agent trace':'Audit events'} load from the live API</b></div>`;return `<div class="timeline">${rows.map(r=>`<div class="event"><div class="dot">${agent?'◎':'•'}</div><div><strong>${esc(agent?r.agent:r.event_type)}</strong><small>${esc(agent?r.purpose:r.actor)}</small><p>${esc(agent?r.summary:r.detail)}</p></div></div>`).join('')}</div>`}
async function reviewDecision(decision){if(String(selected.run_id).startsWith('demo-')){alert('Submit a live framework build first. Demo records are read-only.');return}const notes=document.getElementById('reviewNote')?.value||'';try{const r=await fetch(`${API}/v1/runs/${selected.run_id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewer:'GRC Reviewer',decision,notes})});if(!r.ok)throw new Error(await r.text());detail=await r.json();selected=detail;runs=runs.map(x=>x.run_id===detail.run_id?detail:x);updateCounts();renderReview()}catch(e){alert(`Review blocked: ${e.message}`)}}
async function publishSelected(){if(String(selected.run_id).startsWith('demo-'))return;try{const r=await fetch(`${API}/v1/runs/${selected.run_id}/publish`,{method:'POST'});if(!r.ok)throw new Error(await r.text());await loadRuns();setView('published')}catch(e){alert(`Publication blocked: ${e.message}`)}}
async function renderControls(){let controls=controlSeed.map(([id,domain,title])=>({control_id:id,domain,title}));try{const r=await fetch(`${API}/v1/controls`);if(r.ok)controls=await r.json()}catch(e){}document.getElementById('app').innerHTML=page(`<section class="page-title"><div class="eyebrow">Common control language</div><h2>Aegis Universal Control Library</h2><p>Frameworks remain independent legal instruments. Mapping records where obligations overlap without falsely claiming that different regulations are automatically equivalent.</p></section><section class="panel"><div class="panel-head"><div><small>CANONICAL CONTROLS</small><h3>Control intelligence</h3></div><div class="search">⌕ Search controls</div></div><div class="controls">${controls.map((c,i)=>`<article class="control"><small>${esc(c.control_id)}</small><h3>${esc(c.title)}</h3><p>${esc(c.domain)}</p><footer>${9+i*3} mapped obligations</footer></article>`).join('')}</div></section>`)}
function renderPublished(){const list=runs.filter(r=>r.status==='published');document.getElementById('app').innerHTML=page(`<section class="page-title"><div class="eyebrow">Governed output</div><h2>Published Framework Registry</h2><p>Only human-approved, versioned packages belong here. Amendments create new versions instead of silently overwriting prior compliance logic.</p></section><section class="panel"><div class="panel-head"><div><small>PRODUCTION LIBRARY</small><h3>${list.length} published framework versions</h3></div></div>${list.length?`<div class="published-grid">${list.map(r=>`<article class="published-card"><span class="badge">✓</span><span class="copy"><strong>${esc(r.metadata?.framework_name)}</strong><small>${esc(r.metadata?.regulator||'')} · v${esc(r.metadata?.version||'')}</small></span>${status('published')}</article>`).join('')}</div>`:`<div class="empty"><b>No framework has been published from this factory yet.</b><p>Approve a live framework in the GRC review queue, then publish its immutable version.</p></div>`}</section>`)}
updateCounts();render();loadRuns();
</script>
</body>
</html>
